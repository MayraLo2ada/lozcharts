<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LozCharts · Ejemplo React</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --line: #dedcd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #1a1a19;
          --text: #f0efec;
          --line: #3b3b38;
        }
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: grid;
        gap: 32px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      .filtros {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .filtros button {
        min-height: 36px;
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .filtros button[aria-pressed='true'] {
        background: var(--text);
        color: var(--surface);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="dist/app.js"></script>
  </body>
</html>
