<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LozCharts · Zoom</title>
    <style>
      :root {
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --muted: #52514e;
        --line: #e7e6e1;
      }
      :root[data-theme='dark'] {
        --surface: #1a1a19;
        --text: #f0efec;
        --muted: #c3c2b7;
        --line: #2f2f2d;
      }
      body {
        margin: 0;
        padding: 16px clamp(16px, 2.5vw, 48px);
        background: var(--surface);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        margin: 8px 0;
        font-size: 22px;
      }
      .intro {
        max-width: 72ch;
        color: var(--muted);
      }
      .fila {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .caso {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 12px 8px;
        min-width: 0;
      }
      .caso.ancho {
        grid-column: 1 / -1;
      }
      .caso > p {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .caso.oscuro {
        background: #1a1a19;
        border-color: #2f2f2d;
      }
      .caso.oscuro > p {
        color: #c3c2b7;
      }
      output {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <h1>Zoom de LozCharts</h1>
    <p class="intro">
      El deslizante delgado en X y en Y, la barra con mini gráfico y el tema oscuro. Agrega <code>?tema=oscuro</code> a la
      dirección para ver toda la página en oscuro. Los gráficos quedan en <code>window.qa</code>.
    </p>
    <div class="fila" id="casos"></div>

    <script src="../dist/lozcharts.umd.js"></script>
    <script>
      (function () {
        var oscuro = /tema=oscuro/.test(location.search);
        if (oscuro) document.documentElement.setAttribute('data-theme', 'dark');
        var tema = oscuro ? 'dark' : 'light';

        // Una serie temporal larga y reproducible: ~2000 días de una caminata con tendencia y ciclo.
        var dia = 86400000;
        var inicio = Date.UTC(2021, 0, 1);
        var semilla = 7;
        function azar() {
          semilla = (semilla * 16807) % 2147483647;
          return semilla / 2147483647;
        }
        var largos = [];
        var v = 120;
        for (var i = 0; i < 2000; i++) {
          v += (azar() - 0.48) * 6 + Math.sin(i / 60) * 0.8;
          v = Math.max(20, v);
          largos.push({ fecha: new Date(inicio + i * dia).toISOString().slice(0, 10), visitas: Math.round(v * 10) / 10 });
        }
        var meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        var ventas = meses.map(function (m, k) {
          return { mes: m, ventas: 80 + ((k * 37) % 50), costos: 50 + ((k * 23) % 30) };
        });

        var casos = [
          {
            titulo: 'X delgado (zoom: true), ~2000 puntos con una ventana inicial',
            ancho: true,
            opciones: {
              data: largos,
              xAxis: { field: 'fecha', type: 'time' },
              series: [{ type: 'line', field: 'visitas', name: 'Visitas' }],
              title: 'Visitas diarias',
              zoom: { range: ['2023-03-01', '2023-09-30'] },
            },
          },
          {
            titulo: 'X + Y (zoom: { y: true }) con dos series, anotaciones y área',
            ancho: true,
            opciones: {
              data: largos.map(function (d, k) {
                return { fecha: d.fecha, visitas: d.visitas, media: Math.round((d.visitas * 0.8 + 20) * 10) / 10 };
              }),
              xAxis: { field: 'fecha', type: 'time' },
              yAxis: { title: 'Visitas' },
              series: [
                { type: 'area', field: 'visitas', name: 'Visitas' },
                { type: 'line', field: 'media', name: 'Tendencia' },
              ],
              annotations: [{ y: 150, label: 'Meta' }],
              title: 'Visitas y tendencia',
              zoom: { y: true },
            },
          },
          {
            titulo: 'Solo Y (zoom: { x: false, y: true }) en barras',
            opciones: {
              data: ventas,
              xAxis: { field: 'mes' },
              series: [
                { type: 'bar', field: 'ventas', name: 'Ventas' },
                { type: 'bar', field: 'costos', name: 'Costos' },
              ],
              title: 'Ventas por mes',
              zoom: { x: false, y: true },
            },
          },
          {
            titulo: "scrollbar: 'mini' (la barra con mini gráfico)",
            opciones: {
              data: largos,
              xAxis: { field: 'fecha', type: 'time' },
              series: [{ type: 'line', field: 'visitas', name: 'Visitas' }],
              title: 'Visitas diarias',
              zoom: { range: ['2024-01-01', '2024-06-30'], scrollbar: 'mini' },
            },
          },
          {
            titulo: 'Escala logarítmica con zoom en Y',
            opciones: {
              data: largos.map(function (d, k) {
                return { fecha: d.fecha, usuarios: Math.round(10 * Math.pow(1.0045, k) * (1 + 0.1 * Math.sin(k / 9))) };
              }),
              xAxis: { field: 'fecha', type: 'time' },
              yAxis: { type: 'log' },
              series: [{ type: 'line', field: 'usuarios', name: 'Usuarios' }],
              title: 'Usuarios (log)',
              zoom: { y: true },
            },
          },
          {
            titulo: 'Tema oscuro, X + Y con puntos',
            oscuro: true,
            opciones: {
              data: largos.slice(0, 300),
              xAxis: { field: 'fecha', type: 'time' },
              series: [{ type: 'scatter', field: 'visitas', name: 'Visitas' }],
              title: 'Visitas (oscuro)',
              theme: 'dark',
              zoom: { y: true },
            },
          },
          {
            titulo: 'Horizontal: el zoom en Y se ignora sin romper',
            opciones: {
              data: ventas.slice(0, 6),
              xAxis: { field: 'mes' },
              orientation: 'horizontal',
              series: [{ type: 'bar', field: 'ventas', name: 'Ventas' }],
              title: 'Barras horizontales',
              zoom: { y: true },
            },
          },
        ];

        var raiz = document.getElementById('casos');
        window.qa = casos.map(function (caso) {
          var caja = document.createElement('div');
          caja.className = 'caso' + (caso.ancho ? ' ancho' : '') + (caso.oscuro ? ' oscuro' : '');
          var p = document.createElement('p');
          p.textContent = caso.titulo;
          var lugar = document.createElement('div');
          var salida = document.createElement('output');
          caja.append(p, lugar, salida);
          raiz.appendChild(caja);
          var o = Object.assign({ theme: tema, locale: 'es', height: 320 }, caso.opciones);
          o.onZoom = function (rango, x, y) {
            var f = function (w) {
              return w.start.toFixed(3) + '–' + w.end.toFixed(3);
            };
            salida.textContent = 'onZoom: ' + JSON.stringify(rango) + '  x ' + f(x) + '  y ' + f(y);
          };
          return new LozChart(lugar, o);
        });
      })();
    </script>
  </body>
</html>
