# Cada push y cada pull request: formato, tipos, pruebas, build, el ejemplo de React y el paquete.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # El ejemplo de React compila contra el código actual (si se rompe la API, falla aquí).
      - run: npm run example:react
      # El paquete se puede armar: lo que se publicaría en npm.
      - run: npm pack --dry-run
