# Publica el sitio de LozCharts (portada, galería y documentación) en GitHub Pages en cada push a main.
# Mientras el repositorio sea privado (plan gratis), el trabajo se salta sin error.
# Al hacerlo público: Settings → Pages → Source: "GitHub Actions" (una sola vez).
name: Página de LozCharts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Compila, copia la librería a site/lib y genera la documentación desde el README.
      - run: npm run site
      - name: Armar el sitio
        run: |
          cp -r site _site
          mkdir -p _site/demo _site/dist
          cp demo/index.html _site/demo/index.html
          cp -r dist/* _site/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
