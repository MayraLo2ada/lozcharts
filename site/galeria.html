<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galería · LozCharts</title>
    <meta name="description" content="Todos los tipos de gráfico de LozCharts funcionando, cada uno con el código que lo crea." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/site.css" />
    <style>
      .head {
        padding: var(--s7) 0 var(--s5);
      }
      .filters {
        position: sticky;
        top: 64px;
        z-index: 10;
        background: var(--surface);
        padding: var(--s3) 0;
        border-bottom: 1px solid var(--line);
        margin-bottom: var(--s6);
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s3);
        justify-content: space-between;
        align-items: center;
      }
      .search input {
        min-height: 40px;
        width: min(300px, 100%);
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--raised);
        color: var(--ink);
        font: 400 14.5px/1.2 var(--font);
      }
      .empty {
        color: var(--muted);
        margin: var(--s4) 0 0;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        /* Las fichas anchas ocupan una fila entera: dense rellena el hueco que dejarían. */
        grid-auto-flow: row dense;
        gap: var(--s7) var(--s6);
      }
      @media (min-width: 1800px) {
        .cards {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        /* Con tres columnas, un mapa a todo el ancho completa las filas y se lee mejor. */
        .card-wide-xl {
          grid-column: 1 / -1;
        }
      }
      .card {
        min-width: 0;
        scroll-margin-top: 140px;
      }
      .card[hidden] {
        display: none;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--s3);
        margin-bottom: var(--s3);
      }
      .card-tipo {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .card-tools {
        display: flex;
        gap: var(--s2);
      }
      .card-tools button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font: 500 13px/1 var(--font);
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .card-tools .abrir {
        font: 600 13px/1 var(--font);
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        background: var(--ink);
        color: var(--surface);
        text-decoration: none;
      }
      .card-tools button:hover,
      .card-tools button[aria-expanded='true'] {
        color: var(--ink);
        border-color: var(--line-strong);
      }
      .card .code {
        margin-top: var(--s4);
        max-height: 360px;
        font-size: 12.5px;
      }
      .card-wide {
        grid-column: 1 / -1;
      }
      @media (max-width: 900px) {
        .cards {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <a class="sr-only" href="#contenido">Saltar al contenido</a>
    <header class="top">
      <div class="wrap">
        <a class="wordmark" href="./" aria-label="LozCharts, inicio"
          ><svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="16" width="6" height="12" rx="2" />
            <rect x="13" y="9" width="6" height="19" rx="2" />
            <rect x="22" y="4" width="6" height="24" rx="2" /></svg
          >LozCharts</a
        >
        <nav class="nav" aria-label="Principal">
          <a href="galeria.html" aria-current="page">Galería</a>
          <a href="docs.html">Documentación</a>
          <a class="github" href="https://github.com/MayraLo2ada/lozcharts">GitHub</a>
          <button type="button" class="theme-btn" aria-label="Cambiar a modo oscuro">
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
            </svg>
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main id="contenido" class="wrap">
      <div class="head">
        <h1>Galería</h1>
        <p class="lead">
          Todos los ejemplos funcionan de verdad: pasa el puntero, recórrelos con el teclado y mira el código que los crea.
        </p>
      </div>
      <div class="filters">
        <div class="filter-row">
          <div class="tabs" role="group" aria-label="Filtrar por familia" id="familias"></div>
          <label class="search"
            ><span class="sr-only">Buscar un gráfico</span
            ><input type="search" id="buscar" placeholder="Buscar: barras, mapa, embudo…" autocomplete="off"
          /></label>
        </div>
        <p class="empty" id="vacio" hidden>Nada con ese nombre. Prueba con “línea”, “mapa” o “pie”.</p>
      </div>
      <div class="cards" id="cards"></div>
    </main>

    <footer class="foot">
      <div class="wrap">
        <span>LozCharts · por Mayra Lozada</span>
        <nav aria-label="Pie">
          <a href="./">Inicio</a>
          <a href="docs.html">Documentación</a>
          <a href="https://github.com/MayraLo2ada/lozcharts">GitHub</a>
        </nav>
      </div>
    </footer>

    <script src="lib/lozcharts.umd.js"></script>
    <script src="lib/maps/world.umd.js"></script>
    <script src="assets/site.js"></script>
    <script src="assets/ejemplos.js"></script>
    <script>
      (function () {
        var cards = document.getElementById('cards');
        var familias = ['Todos'];
        EJEMPLOS.forEach(function (ej) {
          if (familias.indexOf(ej.familia) < 0) familias.push(ej.familia);
          var card = document.createElement('article');
          card.className = 'card' + (ej.multiples || ej.ancho ? ' card-wide' : '') + (ej.anchoGrande ? ' card-wide-xl' : '');
          card.id = ej.id;
          card.dataset.familia = ej.familia;
          card.dataset.buscar = [
            ej.opciones.title,
            ej.tipo,
            ej.familia,
            ej.opciones.series
              .map(function (x) {
                return x.type;
              })
              .join(' '),
          ].join(' ');
          var head = document.createElement('div');
          head.className = 'card-head';
          var tipo = document.createElement('span');
          tipo.className = 'card-tipo';
          tipo.textContent = ej.tipo;
          var tools = document.createElement('div');
          tools.className = 'card-tools';
          var abrir = document.createElement('a');
          abrir.href = 'demo.html?id=' + ej.id;
          abrir.className = 'abrir';
          abrir.textContent = 'Abrir y personalizar';
          var ver = document.createElement('button');
          ver.type = 'button';
          ver.textContent = 'Ver código';
          ver.setAttribute('aria-expanded', 'false');
          tools.append(abrir, ver);
          head.append(tipo, tools);
          var box = document.createElement('div');
          var pre = document.createElement('pre');
          pre.className = 'code';
          pre.hidden = true;
          var code = document.createElement('code');
          code.innerHTML = siteHighlight(codigoEjemplo(ej));
          pre.appendChild(code);
          ver.setAttribute('aria-controls', (pre.id = 'codigo-' + ej.id));
          card.append(head, box, pre);
          cards.appendChild(card);
          crearEjemplo(ej, box);
          ver.addEventListener('click', function () {
            pre.hidden = !pre.hidden;
            ver.setAttribute('aria-expanded', String(!pre.hidden));
            ver.textContent = pre.hidden ? 'Ver código' : 'Ocultar código';
          });
        });
        var familia = 'Todos';
        // Busca en el nombre, el tipo y la familia, sin importar acentos ni mayúsculas.
        var plano = function (t) {
          return t
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase();
        };
        var SINONIMOS = {
          linea: 'line',
          barra: 'bar',
          area: 'area',
          torta: 'pie',
          dona: 'donut',
          mapa: 'map',
          calor: 'heatmap',
          flujo: 'sankey',
        };
        function filtrar() {
          var q = plano(document.getElementById('buscar').value.trim());
          var visibles = 0;
          cards.querySelectorAll('.card').forEach(function (c) {
            var texto = plano(c.dataset.buscar);
            var palabra = Object.keys(SINONIMOS).find(function (k) {
              return q && q.indexOf(k) === 0;
            });
            var coincide = !q || texto.indexOf(q) >= 0 || (palabra && texto.indexOf(SINONIMOS[palabra]) >= 0);
            c.hidden = !coincide || (familia !== 'Todos' && c.dataset.familia !== familia);
            if (!c.hidden) visibles++;
          });
          document.getElementById('vacio').hidden = visibles > 0;
        }
        document.getElementById('buscar').addEventListener('input', filtrar);
        var bar = document.getElementById('familias');
        familias.forEach(function (f, i) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = f;
          b.setAttribute('aria-pressed', String(i === 0));
          b.addEventListener('click', function () {
            bar.querySelectorAll('button').forEach(function (o) {
              o.setAttribute('aria-pressed', String(o === b));
            });
            familia = f;
            filtrar();
          });
          bar.appendChild(b);
        });
      })();
    </script>
  </body>
</html>
